<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartWave Tech</title>

<style>
body{margin:0;font-family:Arial;background:#0f172a;color:white;}
header{background:#1e293b;padding:15px;display:flex;justify-content:space-between;}
.logo{color:#38bdf8;font-weight:bold;}
nav a{color:white;margin:0 10px;cursor:pointer;text-decoration:none;}
.container{max-width:1000px;margin:auto;padding:20px;}
.card{background:#1e293b;padding:15px;margin:10px 0;border-radius:8px;}
button{padding:10px;border:none;background:#38bdf8;font-weight:bold;border-radius:5px;cursor:pointer;margin-top:5px;}
input{padding:10px;width:100%;margin:5px 0;border-radius:5px;border:none;}
.hidden{display:none;}
img{max-width:200px;margin-top:10px;}
</style>
</head>
<body>

<header>
<div class="logo">🌐 SMARTWAVE TECH</div>
<nav>
<a onclick="showPage('home')">Home</a>
<a onclick="showPage('services')">Services</a>
<a onclick="showPage('cart')">Cart</a>
<a onclick="showPage('dashboard')">Dashboard</a>
<a onclick="showPage('admin')">Admin</a>
<a onclick="logout()">Logout</a>
</nav>
</header>

<div class="container">

<div id="home">
<h1>AI Digital Services</h1>
</div>

<div id="services" class="hidden"></div>

<div id="cart" class="hidden">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<h3>Total: Tsh <span id="total">0</span></h3>
<input type="file" id="paymentScreenshot">
<button onclick="checkout()">Submit Order</button>
</div>

<div id="dashboard" class="hidden">
<h2>User Dashboard</h2>
<p>Email: <span id="userEmail"></span></p>
</div>

<div id="admin" class="hidden">
<h2>Admin Panel</h2>
<h3>All Users</h3>
<div id="allUsers"></div>
<h3>All Orders</h3>
<div id="allOrders"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } 
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-storage.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "AIzaSyBENJwnlbmo0chVf2JaH2SYN2VU7G7UhrM",
authDomain: "smartwavetech-7623c.firebaseapp.com",
projectId: "smartwavetech-7623c",
storageBucket: "smartwavetech-7623c.firebasestorage.app",
messagingSenderId: "1080838785875",
appId: "1:1080838785875:web:ef2a0b17d7231aeb2cafa6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

/* SERVICES */
const services=[
{id:1,name:"AI Integration",price:5000},
{id:2,name:"Website Design",price:3500}
];

let cart=[];

/* PAGE SWITCH */
window.showPage=function(page){
document.querySelectorAll(".container > div").forEach(div=>div.classList.add("hidden"));
document.getElementById(page).classList.remove("hidden");
if(page==="services") loadServices();
if(page==="cart") loadCart();
if(page==="admin") loadAdmin();
}

/* LOAD SERVICES */
function loadServices(){
const container=document.getElementById("services");
container.innerHTML="<h2>Services</h2>";
services.forEach(s=>{
container.innerHTML+=`
<div class="card">
<h3>${s.name}</h3>
<p>Tsh ${s.price}</p>
<button onclick="addToCart(${s.id})">Add</button>
</div>`;
});
}

window.addToCart=function(id){
const service=services.find(s=>s.id===id);
cart.push(service);
alert("Added to cart");
}

function loadCart(){
let total=0;
const div=document.getElementById("cartItems");
div.innerHTML="";
cart.forEach(item=>{
total+=item.price;
div.innerHTML+=`<div class="card">${item.name} - ${item.price}</div>`;
});
document.getElementById("total").innerText=total;
}

/* CHECKOUT */
window.checkout=async function(){

if(!auth.currentUser){
alert("Login first");
return;
}

const file=document.getElementById("paymentScreenshot").files[0];
if(!file){
alert("Upload payment screenshot");
return;
}

const storageRef=ref(storage,"payments/"+Date.now()+"_"+file.name);
await uploadBytes(storageRef,file);
const imageUrl=await getDownloadURL(storageRef);

await addDoc(collection(db,"orders"),{
userId:auth.currentUser.uid,
services:cart,
total:cart.reduce((sum,item)=>sum+item.price,0),
screenshot:imageUrl,
status:"pending",
createdAt:new Date()
});

alert("Order submitted successfully!");
cart=[];
}

/* ADMIN LOAD */
async function loadAdmin(){

/* LOAD USERS */
const usersSnap=await getDocs(collection(db,"users"));
const usersDiv=document.getElementById("allUsers");
usersDiv.innerHTML="";
usersSnap.forEach(doc=>{
usersDiv.innerHTML+=`<div class="card">${doc.data().email}</div>`;
});

/* LOAD ORDERS */
const ordersSnap=await getDocs(collection(db,"orders"));
const ordersDiv=document.getElementById("allOrders");
ordersDiv.innerHTML="";
ordersSnap.forEach(doc=>{
const data=doc.data();
ordersDiv.innerHTML+=`
<div class="card">
User: ${data.userId}<br>
Total: ${data.total}<br>
Status: ${data.status}<br>
<img src="${data.screenshot}">
</div>`;
});

}

/* DASHBOARD */
onAuthStateChanged(auth,(user)=>{
if(user){
document.getElementById("userEmail").innerText=user.email;
}
});

window.logout=async function(){
await signOut(auth);
alert("Logged out");
showPage("home");
}

</script>

</body>
</html>
